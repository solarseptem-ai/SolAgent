default_model: gpt-4o
default_mode: react
log:
  level: INFO
  format: text

providers:
  - name: openai
    default_model: gpt-4o
    models:
      - gpt-4o
      - gpt-4o-mini
    api_key_env: OPENAI_API_KEY

agents:
  - name: {{name}}
    model: gpt-4o
    mode: react
    max_iterations: 10
    tools: []
    temperature: 0.7

mcp_servers: []