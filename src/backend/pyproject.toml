[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solagent"
version = "0.1.0"
description = "Production-grade AI Agent Framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "SolarSeptem", email = "dev@solarseptem.dev" },
]
keywords = ["ai", "agent", "llm", "framework", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.39",
    "tiktoken>=0.7",
    "grpcio>=1.82.1",
    "grpcio-tools>=1.82.1",
    "protobuf>=5.0",
    "pyyaml>=6.0.3",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "json-repair>=0.1",
    "certifi>=2024.0",
]

[project.optional-dependencies]
chromadb = ["chromadb>=0.5"]
lancedb = ["lancedb>=0.15"]
docker = ["docker>=7.0"]
remote = ["arq>=0.26", "nats-py>=2.0"]
media = ["Pillow>=10.0"]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
all = ["solagent[chromadb,lancedb,docker,remote,media,observability]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.2",
    "twine>=5.0",
    "ruff>=0.6",
]

[project.scripts]
solagent = "solagent.cli.main:main"

[project.urls]
Homepage = "https://github.com/solarseptem-ai/solagent"
Repository = "https://github.com/solarseptem-ai/solagent"
Issues = "https://github.com/solarseptem-ai/solagent/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.hatch.build.targets.sdist]
include = ["solagent"]

[tool.hatch.build.targets.wheel]
packages = ["solagent"]
